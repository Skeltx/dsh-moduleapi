# dsh-moduleapi — bundle patch layer.
# Registers the `moduleapi` route on the built-in (dormant) `llm-pi-ai` adapter.
# Applied automatically when this package is listed in the profile's
# `dsh.profile.bundles`. See README.md for installation.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      moduleapi:
        displayName: Module API
        apiKeyEnv: MODULEAPI_API_KEY
        api: openai-completions
        baseURL: https://moduleapi.pro/v1
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 65536
          - id: deepseek-v4-pro
            name: DeepSeek V4.1 Pro
            contextWindow: 1000000
            maxTokens: 65536
          - id: gpt-5.4
            name: GPT-5.4
            contextWindow: 400000
            maxTokens: 32768
          - id: claude-sonnet-5
            name: Claude Sonnet 5
            contextWindow: 200000
            maxTokens: 32768
          - id: gemini-3.8-flash
            name: Gemini 3.8 Flash
            contextWindow: 1000000
            maxTokens: 32768
